<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Migrasi Data ke Firebase - Grandia Game Tavern</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      color: #38bdf8;
      font-size: 1.5rem;
      margin-top: 0;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
    }
    .status-box {
      background: #0f172a;
      border-radius: 8px;
      padding: 16px;
      font-family: monospace;
      font-size: 0.9rem;
      min-height: 120px;
      max-height: 250px;
      overflow-y: auto;
      margin: 20px 0;
      border: 1px solid #334155;
      color: #4ade80;
    }
    button {
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>🚀 Tool Migrasi Data ke Firebase Firestore</h1>
  <p>Alat ini akan mengunggah seluruh katalog game PC & PS2 kamu dari file lokal ke <strong>Firebase Firestore Cloud Database</strong> secara otomatis.</p>
  
  <div id="summary">Memeriksa data lokal...</div>
  <div class="status-box" id="log">Status: Siap dimulai.\n</div>
  
  <button id="start-btn" onclick="startMigration()">Mulai Upload Data ke Firebase</button>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="js/firebase-config.js"></script>

<!-- Data Lokal Bawaan -->
<script src="data/pc_games.js"></script>
<script src="data/ps2_games.js"></script>

<script>
  const logEl = document.getElementById('log');
  const summaryEl = document.getElementById('summary');
  const startBtn = document.getElementById('start-btn');

  const pcData = window.PC_GAMES_DATA || [];
  const ps2Data = window.PS2_GAMES_DATA || [];
  
  summaryEl.innerHTML = `Terdeteksi <strong>${pcData.length} Game PC</strong> dan <strong>${ps2Data.length} Game PS2</strong> lokal.`;

  function log(msg) {
    logEl.innerText += msg + '\n';
    logEl.scrollTop = logEl.scrollHeight;
  }

  function parseSizeToGB(sizeVal) {
    if (!sizeVal) return 0;
    if (typeof sizeVal === 'number') return sizeVal;
    const s = String(sizeVal).replace(',', '.').toUpperCase();
    const match = s.match(/\d+(?:\.\d+)?/);
    const num = match ? parseFloat(match[0]) : NaN;
    if (isNaN(num)) return 0;
    if (s.includes('MB')) return num / 1024;
    if (s.includes('KB')) return num / (1024 * 1024);
    return num;
  }

  async function startMigration() {
    if (!window.db || !window.auth) {
      alert("Firebase belum terinisialisasi! Pastikan Firestore sudah diaktifkan di Firebase Console.");
      return;
    }

    if (!window.auth.currentUser) {
      log("🔒 Otentikasi Admin diperlukan untuk izin menulis ke Firestore...");
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await window.auth.signInWithPopup(provider);
        log("🔑 Login Admin Berhasil! Melanjutkan migrasi...");
      } catch (authErr) {
        log(`❌ Gagal Login Admin: ${authErr.message}`);
        alert("Kamu harus login sebagai Admin terlebih dahulu untuk melakukan upload data!");
        return;
      }
    }

    startBtn.disabled = true;

    log("▶ Membersihkan data lama bermasalah di Firestore...");
    try {
      const oldSnapshot = await db.collection('games').get();
      if (!oldSnapshot.empty) {
        const deleteBatches = [];
        let curBatch = db.batch();
        let count = 0;
        oldSnapshot.forEach(doc => {
          curBatch.delete(doc.ref);
          count++;
          if (count % 400 === 0) {
            deleteBatches.push(curBatch.commit());
            curBatch = db.batch();
          }
        });
        deleteBatches.push(curBatch.commit());
        await Promise.all(deleteBatches);
        log(`✔ Berhasil membersihkan ${oldSnapshot.size} data lama.`);
      }
    } catch(err) {
      log(`⚠ Gagal hapus data lama: ${err.message}`);
    }

    log("▶ Mengambil data custom games dari server jika ada...");

    let customData = [];
    try {
      const res = await fetch('/api/data');
      if (res.ok) {
        customData = await res.json();
      }
    } catch(e) {
      log("⚠ Mengabaikan fetch /api/data, lanjut dengan data bawaan.");
    }

    const allGames = [];
    
    // Process PC Games
    pcData.forEach((g, idx) => {
      const rawSize = g.game_info ? g.game_info['Game Size'] : (g.sizeGB || g.size);
      const sizeGB = parseSizeToGB(rawSize);
      const coverUrl = g.banner_url || g.cover || '';
      allGames.push({
        id: g.id || `pc-${idx}`,
        title: g.title,
        category: 'pc',
        size: sizeGB,
        sizeGB: sizeGB,
        cover: coverUrl,
        banner_url: coverUrl,
        game_info: g.game_info || {
          Genre: g.genre || 'Action',
          Developer: g.developer || 'Unknown',
          'Game Size': `${sizeGB.toFixed(1)} GB`
        },
        system_requirements: Array.isArray(g.system_requirements) ? g.system_requirements : (g.requirements || []),
        updatedAt: new Date().toISOString()
      });
    });

    // Process PS2 Games
    ps2Data.forEach((g, idx) => {
      const rawSize = g.game_info ? g.game_info['Game Size'] : (g.sizeGB || g.size);
      const sizeGB = parseSizeToGB(rawSize);
      const coverUrl = g.banner_url || g.cover || '';
      allGames.push({
        id: g.id || `ps2-${idx}`,
        title: g.title,
        category: 'ps2',
        size: sizeGB,
        sizeGB: sizeGB,
        cover: coverUrl,
        banner_url: coverUrl,
        game_info: g.game_info || {
          Genre: g.genre || 'Action',
          Developer: g.developer || 'Unknown',
          'Game Size': `${sizeGB.toFixed(1)} GB`
        },
        system_requirements: Array.isArray(g.system_requirements) ? g.system_requirements : (g.requirements || []),
        updatedAt: new Date().toISOString()
      });
    });

    // Process Custom Games
    if (Array.isArray(customData)) {
      customData.forEach((g, idx) => {
        const rawSize = g.game_info ? g.game_info['Game Size'] : (g.sizeGB || g.size);
        const sizeGB = parseSizeToGB(rawSize);
        const coverUrl = g.banner_url || g.cover || '';
        allGames.push({
          id: g.id || `custom_${idx}_${Date.now()}`,
          title: g.title,
          category: g.category || 'pc',
          size: sizeGB,
          sizeGB: sizeGB,
          cover: coverUrl,
          banner_url: coverUrl,
          game_info: g.game_info || {
            Genre: g.genre || 'Action',
            Developer: g.developer || 'Unknown',
            'Game Size': `${sizeGB.toFixed(1)} GB`
          },
          system_requirements: Array.isArray(g.system_requirements) ? g.system_requirements : (g.requirements || []),
          updatedAt: new Date().toISOString()
        });
      });
    }

    log(`▶ Total ${allGames.length} game siap diunggah ke koleksi 'games' Firestore...`);

    const collectionRef = db.collection('games');
    const BATCH_SIZE = 450;
    let successCount = 0;

    for (let i = 0; i < allGames.length; i += BATCH_SIZE) {
      const chunk = allGames.slice(i, i + BATCH_SIZE);
      const batch = db.batch();

      chunk.forEach(game => {
        const docRef = collectionRef.doc(game.id);
        batch.set(docRef, game, { merge: true });
      });

      try {
        await batch.commit();
        successCount += chunk.length;
        log(`✔ Berhasil mengunggah ${successCount} dari ${allGames.length} game...`);
      } catch (err) {
        log(`❌ Gagal batch upload: ${err.message}`);
      }
    }

    log("🎉 SELESAI! Seluruh data game berhasil diunggah ke Firebase Firestore!");
    alert("Migrasi Data ke Firebase Selesai!");
    startBtn.disabled = false;
    startBtn.innerText = "Migrasi Ulang";
  }
</script>

</body>
</html>
